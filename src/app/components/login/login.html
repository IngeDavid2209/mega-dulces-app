<div class="login-layout">
  <div class="login-wrapper">
    
    <div class="login-brand-section">
      <div class="brand-content">
        <div class="brand-logo-wrap">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><path d="M12 6a6 6 0 1 0 6 6 6 6 0 0 0-6-6zm0 10a4 4 0 1 1 4-4 4 4 0 0 1-4 4z"/>
          </svg>
        </div>
        <h1 class="brand-title">Mega Dulces</h1>
        <p class="brand-subtitle">Panel Enterprise de Gestión Operativa</p>
      </div>
      <div class="brand-footer">
        © 2024 Mega Dulces de los Altos. Todos los derechos reservados.
      </div>
    </div>

    <div class="login-form-section">
      <div class="form-content-wrapper">
        <h2 class="form-title">Iniciar Sesión</h2>
        <p class="form-instruction">Ingresa tus credenciales corporativas para acceder al panel.</p>

        <form (ngSubmit)="ingresar()">

          <div class="role-selector">
            <button type="button" class="role-btn"
                    [class.active]="rolSeleccionado() === 'admin'"
                    (click)="seleccionarRol('admin')">
              Administrador
            </button>
            <button type="button" class="role-btn"
                    [class.active]="rolSeleccionado() === 'trabajador'"
                    (click)="seleccionarRol('trabajador')">
              Colaborador
            </button>
          </div>

          <div class="form-group">
            <label class="form-label">Correo o Usuario</label>
            <div class="input-icon-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              <input class="form-input" type="text" name="usuario" [(ngModel)]="usuario" placeholder="ejemplo@megadulces.com">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Contraseña</label>
            <div class="input-icon-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input class="form-input" type="password" name="password" [(ngModel)]="password" placeholder="••••••••">
            </div>
          </div>

          <button class="btn-primary-login" type="submit">Entrar al Sistema</button>
        </form>
      </div>
    </div>

  </div>
</div>
