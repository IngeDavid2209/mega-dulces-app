<div class="login-layout">
  <div class="login-wrapper">
    
    <div class="login-brand-section">
      <div class="brand-content">
        <div class="brand-logo-wrap">
          <img src="https://static.wixstatic.com/media/fd397e_0fd82a1ecec84a118ceeb603b493f25a~mv2.png" alt="Mega Dulces" class="brand-logo-img">
        </div>
        </div>
      <div class="brand-footer">
        © 2024 Mega Dulces de los Altos. Todos los derechos reservados.
      </div>
    </div>

    <div class="login-form-section">
      <div class="form-content-wrapper">
        <h2 class="form-title">Iniciar Sesión</h2>
        <p class="form-instruction">Ingresa tus credenciales corporativas para acceder al panel.</p>

        <form (ngSubmit)="ingresar()">

          <div class="role-selector">
            <button type="button" class="role-btn" 
                    [class.active]="rolSeleccionado() === 'admin'" 
                    (click)="seleccionarRol('admin')">
              Administrador
            </button>
            <button type="button" class="role-btn" 
                    [class.active]="rolSeleccionado() === 'trabajador'" 
                    (click)="seleccionarRol('trabajador')">
              Colaborador
            </button>
          </div>

         <div class="form-group">
            <label class="form-label">Usuario</label>
            <div class="input-icon-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input class="form-input" type="text" name="usuario" [(ngModel)]="usuario" placeholder="Ej: admin.megadulces" style="padding-left: 42px !important;">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Contraseña</label>
            <div class="input-icon-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input class="form-input" type="password" name="password" [(ngModel)]="password" placeholder="••••••" maxlength="6" style="padding-left: 42px !important;">
            </div>
          </div>

          <button class="btn-primary-login" type="submit">Entrar al Sistema</button>
        </form>
      </div>
    </div>

  </div>
</div>
