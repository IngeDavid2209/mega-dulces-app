<div class="login-layout">

  <div class="watermark watermark-top">MEGA</div>
  <div class="watermark watermark-bottom">DULCES</div>

  <div class="top-bar">
    <button class="btn-theme-toggle">
      MODO B&N
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>

  <div class="login-container">
    <div class="logo-container">
      <img src="https://static.wixstatic.com/media/fd397e_0fd82a1ecec84a118ceeb603b493f25a~mv2.png" alt="Mega Dulces"
        class="main-logo">
    </div>

    <div class="portal-subtitle">PORTAL DE ACCESO</div>

    <div class="login-card">
      <form (ngSubmit)="ingresar()">

        <div class="form-group">
          <label class="form-label">USUARIO</label>
          <input class="form-input" type="text" name="usuario" [(ngModel)]="usuario" placeholder="Ej. jperez"
            autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username"
            inputmode="email">
        </div>

        <div class="form-group">
          <label class="form-label">CONTRASEÑA</label>
          <input class="form-input" type="password" name="password" [(ngModel)]="password" placeholder="••••••••"
            maxlength="6">
        </div>

        <button class="btn-submit" type="submit" [disabled]="ingresando">
          {{ ingresando ? 'VERIFICANDO...' : 'INICIAR SESIÓN' }}
        </button>
      </form>
    </div>

    <div class="login-footer">
      <a href="#" class="footer-link">Recuperar Acceso</a>
      <a href="#" class="footer-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: text-bottom;">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg> Soporte
      </a>
    </div>

    <div class="login-build-sello" title="Versión instalada en este dispositivo">
      🏷️ Versión {{ buildSello }}
    </div>

  </div>
</div>
