<div class="contenedor-principal">
  <h2>👤 Mi Perfil</h2>
  <p style="color: gray; margin-bottom: 20px;">Actualiza tus credenciales de acceso y contacto. Recuerda que necesitarás tu contraseña actual para guardar los cambios.</p>

  <div class="tarjeta-perfil" style="background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px;">
    
    <div class="info-estatica" style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #e2e8f0;">
      <h3 style="margin: 0; color: #0F172A;">{{ currentUser?.nombre }}</h3>
      <p style="margin: 5px 0 0 0; color: #3b82f6; font-weight: bold;">{{ currentUser?.cargo }}</p>
      <p style="margin: 5px 0 0 0; font-size: 14px; color: gray;">Sucursal: {{ currentUser?.sucursales?.join(', ') || 'General' }}</p>
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Correo Electrónico de Acceso</label>
      <input type="email" [(ngModel)]="formCorreo" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Teléfono (WhatsApp)</label>
      <input type="text" [(ngModel)]="formTelefono" placeholder="Ej: 523521234567" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px;">
    </div>

    <div class="form-group" style="margin-bottom: 20px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Nueva Contraseña</label>
      <input type="password" [(ngModel)]="formPassword" placeholder="Déjalo en blanco si no quieres cambiarla" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px;">
      <small style="color: gray;">Mínimo 6 caracteres.</small>
    </div>

    <button (click)="actualizarMisDatos()" style="width: 100%; background-color: #0F172A; color: white; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
      💾 Guardar Cambios
    </button>
  </div>
</div>
