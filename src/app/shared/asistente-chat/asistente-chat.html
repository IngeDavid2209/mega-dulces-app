<!-- Boton flotante -->
<button *ngIf="!abierto" class="ac-fab" (click)="abrir()" title="Asistente" aria-label="Asistente">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
  </svg>
</button>

<!-- Panel de chat -->
<div *ngIf="abierto" class="ac-overlay" (click)="cerrar()">
  <div class="ac-panel" (click)="$event.stopPropagation()">

    <div class="ac-header">
      <div class="ac-title">
        <span class="ac-dot" [class.ac-dot-habla]="hablando" [class.ac-dot-escucha]="escuchando"></span>
        Asistente
        <span *ngIf="hablando" class="ac-estado">· hablando</span>
        <span *ngIf="escuchando" class="ac-estado">· escuchando</span>
      </div>
      <button class="ac-close" (click)="cerrar()" aria-label="Cerrar">&times;</button>
    </div>

    <div #cuerpo class="ac-body">
      <div *ngFor="let m of mensajes" class="ac-msg" [class.ac-msg-user]="m.de === 'user'" [class.ac-msg-bot]="m.de === 'bot'">
        <div class="ac-burbuja">
          {{ m.texto }}
          <div *ngIf="m.whatsapps?.length" class="ac-wa-wrap">
            <button *ngFor="let w of m.whatsapps" type="button" class="ac-wa-btn" (click)="abrirWhatsapp(w)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.04c-.24.68-1.42 1.3-1.95 1.34-.5.04-.5.4-3.15-.66-2.66-1.05-4.34-3.76-4.47-3.94-.13-.18-1.07-1.42-1.07-2.71s.68-1.92.92-2.18c.24-.26.53-.33.71-.33.18 0 .35 0 .51.01.16.01.38-.06.59.45.24.58.81 2 .88 2.14.07.14.12.31.02.49-.09.18-.14.29-.27.45-.13.16-.28.35-.4.47-.13.13-.27.28-.12.54.15.26.66 1.09 1.42 1.77.97.87 1.79 1.14 2.05 1.27.26.13.41.11.56-.07.15-.18.65-.76.82-1.02.17-.26.35-.22.59-.13.24.09 1.52.72 1.78.85.26.13.43.2.5.31.06.11.06.65-.18 1.33z"/>
              </svg>
              Enviar a {{ w.nombre }} por WhatsApp
            </button>
          </div>
        </div>
      </div>
      <div *ngIf="cargando" class="ac-msg ac-msg-bot">
        <div class="ac-burbuja ac-escribiendo">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div class="ac-input-row">
      <button *ngIf="hayVoz" class="ac-mic" [class.ac-mic-on]="escuchando" (click)="dictar()"
        title="Dictar" aria-label="Dictar por voz">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <input class="ac-input" type="text" [(ngModel)]="entrada" (keyup.enter)="enviar()"
        [placeholder]="escuchando ? 'Escuchando...' : 'Escribe o dicta...'" [disabled]="cargando">
      <button class="ac-send" (click)="enviar()" [disabled]="cargando || !entrada.trim()" aria-label="Enviar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

  </div>
</div>
