<!-- Boton flotante -->
<button *ngIf="!abierto" class="ac-fab" (click)="abrir()" title="Asistente" aria-label="Asistente">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
  </svg>
</button>

<!-- Panel de chat -->
<div *ngIf="abierto" class="ac-overlay" (click)="cerrar()">
  <div class="ac-panel" (click)="$event.stopPropagation()">

    <div class="ac-header">
      <div class="ac-title"><span class="ac-dot"></span> Asistente</div>
      <button class="ac-close" (click)="cerrar()" aria-label="Cerrar">&times;</button>
    </div>

    <div #cuerpo class="ac-body">
      <div *ngFor="let m of mensajes" class="ac-msg" [class.ac-msg-user]="m.de === 'user'" [class.ac-msg-bot]="m.de === 'bot'">
        <div class="ac-burbuja">{{ m.texto }}</div>
      </div>
      <div *ngIf="cargando" class="ac-msg ac-msg-bot">
        <div class="ac-burbuja ac-escribiendo">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div class="ac-input-row">
      <button *ngIf="hayVoz" class="ac-mic" [class.ac-mic-on]="escuchando" (click)="dictar()"
        title="Dictar" aria-label="Dictar por voz">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <input class="ac-input" type="text" [(ngModel)]="entrada" (keyup.enter)="enviar()"
        [placeholder]="escuchando ? 'Escuchando...' : 'Escribe o dicta...'" [disabled]="cargando">
      <button class="ac-send" (click)="enviar()" [disabled]="cargando || !entrada.trim()" aria-label="Enviar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

  </div>
</div>
